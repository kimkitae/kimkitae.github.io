<!-- Brand icons: source avatar SVG with a truthful 1024px PNG fallback. -->

{% capture favicon_path %}{{ '/assets/img/favicons' | relative_url }}{% endcapture %}
{% capture brand_icon %}{{ '/assets/brand/kf-avatar-dark' | relative_url }}{% endcapture %}

<link rel="icon" type="image/svg+xml" href="{{ brand_icon }}.svg">
<link rel="icon" type="image/png" sizes="1024x1024" href="{{ brand_icon }}.png">
<link rel="apple-touch-icon" sizes="1024x1024" href="{{ brand_icon }}.png">
{% if site.pwa.enabled %}
  <link rel="manifest" href="{{ favicon_path }}/site.webmanifest">
{% endif %}
<meta name="apple-mobile-web-app-title" content="{{ site.title }}">
<meta name="application-name" content="{{ site.title }}">
<meta name="msapplication-TileColor" content="#101416">
<meta name="msapplication-config" content="{{ favicon_path }}/browserconfig.xml">
