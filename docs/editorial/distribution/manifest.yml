# Distribution manifest. All channel statuses are prepared, not published.
# naver: manual upload from docs/editorial/distribution/naver/<slug>.md
# naver images: export each source SVG to the mapped PNG, then upload the PNG.
# medium: official import of the live English URL, then set canonical if needed
# dev: reuse English Markdown without Jekyll front matter, set canonical_url
version: 2
status: prepared_not_scheduled
channels:
  naver:
    status: pending
    source: docs/editorial/distribution/naver/<slug>.md
    image_source: assets/img/posts/renewal/<slug>.svg
    image_export: naver-images/<slug>.svg.png
    upload_note: Upload the exported PNG, not the SVG. Place it after the introduction or the section named in the draft. Record the published URL and date after upload.
  medium:
    status: pending
    source: live English URL at /en/posts/<slug>/
    method: official Medium import, which attaches the original URL and date
  dev:
    status: pending
    source: live English Markdown with Jekyll front matter removed
    method: Forem API or manual post with canonical_url set to the English page
campaign:
  name: naver_weekly_ax_selection
  status: planned_not_scheduled
  weekly_order:
    - mobile-automation
    - setup-slackbot-initialization
    - quick-start-rag-and-llm-for-automation
    - compare-sounds-automation
    - sms-management-system
    - log-view-system
    - mobile-mcp-setup-guide
    - makingAutomationTesterWhoNeverBeTired
  archive_reference:
    - testing1
    - testing2
    - webdriveragent-upgrade
    - automation1
    - automation2
    - making-booting-image-ubuntu-on-mac
    - mount-volumes-nfs-and-smb-from-nas-copy
    - setting-network-setting
  state: No Naver platform ID or publication date is recorded. Nothing is scheduled or published by this manifest.
