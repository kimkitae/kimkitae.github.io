<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc">
  <title id="title">Two runs sharing one phone number</title>
  <desc id="desc">A synthetic timeline. Run A and run B both request a code. B's code 1111 arrives, then A's code 2222 arrives and overwrites the latest value. B reads 2222, which belongs to A. The figure shows why arrival order is not request order.</desc>
  <rect width="640" height="660" fill="#fbfaf7"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4f6d7a"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#b3261e"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="320" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#1f2d36">Two runs, one latest value</text>
    <text x="320" y="80" text-anchor="middle" font-size="22" fill="#4a5a64">Synthetic timeline, not a recorded incident</text>

    <text x="140" y="128" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2d36">Run A</text>
    <text x="320" y="128" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2d36">Phone / Redis</text>
    <text x="500" y="128" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2d36">Run B</text>

    <line x1="140" y1="148" x2="140" y2="500" stroke="#9aaab4" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="320" y1="148" x2="320" y2="500" stroke="#9aaab4" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="500" y1="148" x2="500" y2="500" stroke="#9aaab4" stroke-width="2" stroke-dasharray="6 6"/>

    <text x="230" y="188" text-anchor="middle" font-size="22" fill="#3f4f59">A sends request</text>
    <line x1="155" y1="202" x2="304" y2="202" stroke="#4f6d7a" stroke-width="3" marker-end="url(#arrow)"/>

    <text x="410" y="240" text-anchor="middle" font-size="22" fill="#3f4f59">B sends request</text>
    <line x1="485" y1="254" x2="336" y2="254" stroke="#4f6d7a" stroke-width="3" marker-end="url(#arrow)"/>

    <text x="410" y="310" text-anchor="middle" font-size="22" fill="#3f4f59">1111 arrives</text>
    <line x1="336" y1="324" x2="485" y2="324" stroke="#4f6d7a" stroke-width="3" marker-end="url(#arrow)"/>

    <text x="230" y="380" text-anchor="middle" font-size="22" fill="#3f4f59">2222 arrives</text>
    <line x1="304" y1="394" x2="155" y2="394" stroke="#4f6d7a" stroke-width="3" marker-end="url(#arrow)"/>

    <text x="410" y="450" text-anchor="middle" font-size="22" font-weight="700" fill="#7a1f1a">B reads 2222</text>
    <line x1="485" y1="464" x2="336" y2="464" stroke="#b3261e" stroke-width="3" marker-end="url(#arrowRed)"/>

    <rect x="242" y="476" width="156" height="30" fill="#fbfaf7"/>
    <text x="320" y="500" text-anchor="middle" font-size="22" fill="#4a5a64">latest = 2222</text>

    <rect x="60" y="524" width="520" height="72" rx="14" fill="#fdecea" stroke="#b3261e" stroke-width="2"/>
    <text x="320" y="556" text-anchor="middle" font-size="22" font-weight="700" fill="#7a1f1a">Run B reads Run A's code</text>
    <text x="320" y="584" text-anchor="middle" font-size="22" fill="#7a1f1a">1111 was overwritten, not queued</text>

    <text x="320" y="636" text-anchor="middle" font-size="22" fill="#4a5a64">Lease the number, or carry a correlation id.</text>
  </g>
</svg>
