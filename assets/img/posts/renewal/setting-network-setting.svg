<svg xmlns="http://www.w3.org/2000/svg" width="640" height="950" viewBox="0 0 640 950" role="img" aria-labelledby="title desc">
  <title id="title">Netplan change with rollback</title>
  <desc id="desc">Check interfaces, write YAML, validate with netplan generate and try, then apply and verify with a console rollback available. Wi-Fi with networkd also needs wpasupplicant.</desc>
  <rect width="640" height="950" fill="#F7F9FB"/>
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#006779"/></marker>
  </defs>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="320" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#101416">Netplan change with rollback</text>

    <rect x="60" y="90" width="520" height="126" rx="4" fill="#F7F9FB" stroke="#006779" stroke-width="2"/>
    <text x="320" y="136" text-anchor="middle" font-size="28" font-weight="700" fill="#101416">ip a</text>
    <text x="320" y="174" text-anchor="middle" font-size="22" fill="#526573">find interface names</text>

    <rect x="60" y="266" width="520" height="126" rx="4" fill="#F7F9FB" stroke="#006779" stroke-width="2"/>
    <text x="320" y="312" text-anchor="middle" font-size="28" font-weight="700" fill="#101416">Write YAML</text>
    <text x="320" y="350" text-anchor="middle" font-size="22" fill="#526573">back up the original first</text>

    <rect x="60" y="442" width="520" height="126" rx="4" fill="#f4ecd8" stroke="#c9a227" stroke-width="2"/>
    <text x="320" y="488" text-anchor="middle" font-size="28" font-weight="700" fill="#101416">generate + try</text>
    <text x="320" y="526" text-anchor="middle" font-size="22" fill="#526573">auto rollback on timeout</text>

    <rect x="60" y="618" width="520" height="126" rx="4" fill="#F7F9FB" stroke="#006779" stroke-width="2"/>
    <text x="320" y="664" text-anchor="middle" font-size="28" font-weight="700" fill="#101416">netplan apply</text>
    <text x="320" y="702" text-anchor="middle" font-size="22" fill="#526573">confirm the change</text>

    <rect x="60" y="794" width="520" height="126" rx="4" fill="#101416"/>
    <text x="320" y="840" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">Verify</text>
    <text x="320" y="878" text-anchor="middle" font-size="22" fill="#F4F6F5">ip route + DNS</text>
    <text x="320" y="906" text-anchor="middle" font-size="22" fill="#F4F6F5">console rollback ready</text>

    <line x1="320" y1="216" x2="320" y2="256" stroke="#006779" stroke-width="3" marker-end="url(#a)"/>
    <line x1="320" y1="392" x2="320" y2="432" stroke="#006779" stroke-width="3" marker-end="url(#a)"/>
    <line x1="320" y1="568" x2="320" y2="608" stroke="#006779" stroke-width="3" marker-end="url(#a)"/>
    <line x1="320" y1="744" x2="320" y2="784" stroke="#006779" stroke-width="3" marker-end="url(#a)"/>
  </g>
</svg>
