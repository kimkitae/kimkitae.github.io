<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960" role="img" aria-labelledby="title desc">
  <title id="title">Exploration is not a regression test</title>
  <desc id="desc">Natural-language exploration produces a model summary that is not evidence. Action evidence needs before and after screenshots, an accessibility snapshot, device logs, and business state. A person reviews the flow, and only then does it become a regression scenario. Repeated runs are a smoke check, not proof of deterministic behavior.</desc>
  <rect width="640" height="960" fill="#F7F9FB"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#006779"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="320" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#172B3A">Exploration is not a test</text>
    <text x="320" y="80" text-anchor="middle" font-size="22" fill="#526573">Model output is a claim, not a result</text>

    <rect x="60" y="108" width="520" height="96" rx="4" fill="#F7F9FB" stroke="#006779" stroke-width="2"/>
    <text x="320" y="144" text-anchor="middle" font-size="24" font-weight="700" fill="#172B3A">Ask in natural language</text>
    <text x="320" y="176" text-anchor="middle" font-size="22" fill="#526573">record device, app build, permissions</text>

    <line x1="320" y1="204" x2="320" y2="228" stroke="#006779" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="60" y="230" width="520" height="106" rx="4" fill="#fdecea" stroke="#b3261e" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="320" y="266" text-anchor="middle" font-size="24" font-weight="700" fill="#7a1f1a">"Tapped. Settings opened."</text>
    <text x="320" y="298" text-anchor="middle" font-size="22" fill="#7a1f1a">a model summary, not evidence</text>
    <text x="320" y="324" text-anchor="middle" font-size="22" fill="#7a1f1a">outside the evidence boundary</text>

    <line x1="320" y1="336" x2="320" y2="360" stroke="#006779" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="60" y="362" width="520" height="150" rx="4" fill="#F7F9FB" stroke="#006779" stroke-width="2"/>
    <text x="320" y="398" text-anchor="middle" font-size="24" font-weight="700" fill="#172B3A">Collect action evidence</text>
    <text x="320" y="430" text-anchor="middle" font-size="22" fill="#526573">before and after screenshots</text>
    <text x="320" y="458" text-anchor="middle" font-size="22" fill="#526573">accessibility snapshot + device log</text>
    <text x="320" y="486" text-anchor="middle" font-size="22" fill="#526573">business state via API or database</text>

    <line x1="320" y1="512" x2="320" y2="536" stroke="#006779" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="60" y="538" width="520" height="120" rx="4" fill="#f4ecd8" stroke="#c9a227" stroke-width="2"/>
    <text x="320" y="574" text-anchor="middle" font-size="24" font-weight="700" fill="#172B3A">A person reviews the flow</text>
    <text x="320" y="606" text-anchor="middle" font-size="22" fill="#5d5323">does the identifier collide?</text>
    <text x="320" y="634" text-anchor="middle" font-size="22" fill="#5d5323">are the preconditions written down?</text>

    <line x1="320" y1="658" x2="320" y2="682" stroke="#006779" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="60" y="684" width="520" height="130" rx="4" fill="#e7f4ec" stroke="#1e6b3a" stroke-width="2"/>
    <text x="320" y="720" text-anchor="middle" font-size="24" font-weight="700" fill="#172B3A">Regression scenario</text>
    <text x="320" y="752" text-anchor="middle" font-size="22" fill="#526573">fixed data, explicit assertion</text>
    <text x="320" y="780" text-anchor="middle" font-size="22" fill="#526573">repeat run is a smoke check</text>

    <text x="320" y="866" text-anchor="middle" font-size="22" fill="#526573">Keep the reviewed steps, not the instruction.</text>
    <text x="320" y="896" text-anchor="middle" font-size="22" fill="#526573">No emulator or device run was performed for this figure.</text>
    <text x="320" y="926" text-anchor="middle" font-size="22" fill="#526573">Tool names and versions change; check upstream.</text>
  </g>
</svg>
