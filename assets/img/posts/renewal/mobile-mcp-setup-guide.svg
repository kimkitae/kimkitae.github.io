<svg xmlns="http://www.w3.org/2000/svg" width="640" height="950" viewBox="0 0 640 950" role="img" aria-labelledby="title desc">
  <title id="title">Mobile MCP connection</title>
  <desc id="desc">Cursor or Claude Desktop connects to a local MCP server, which reads accessibility snapshots and sends actions to iOS or Android devices for an exploratory test run.</desc>
  <rect width="640" height="950" fill="#fbfaf7"/>
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4f6d7a"/></marker>
  </defs>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="320" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#2f4858">Mobile MCP connection</text>

    <rect x="60" y="90" width="520" height="126" rx="18" fill="#e6edf1" stroke="#4f6d7a" stroke-width="2"/>
    <text x="320" y="136" text-anchor="middle" font-size="28" font-weight="700" fill="#2f4858">AI client</text>
    <text x="320" y="174" text-anchor="middle" font-size="22" fill="#5d6b75">Cursor or Claude Desktop</text>

    <rect x="60" y="266" width="520" height="126" rx="18" fill="#f4ecd8" stroke="#c9a227" stroke-width="2"/>
    <text x="320" y="312" text-anchor="middle" font-size="28" font-weight="700" fill="#2f4858">MCP server</text>
    <text x="320" y="350" text-anchor="middle" font-size="22" fill="#5d6b75">tool list + actions</text>

    <rect x="60" y="442" width="520" height="126" rx="18" fill="#e6edf1" stroke="#4f6d7a" stroke-width="2"/>
    <text x="320" y="488" text-anchor="middle" font-size="28" font-weight="700" fill="#2f4858">Accessibility snapshot</text>
    <text x="320" y="526" text-anchor="middle" font-size="22" fill="#5d6b75">screen elements</text>

    <rect x="60" y="618" width="520" height="126" rx="18" fill="#e6edf1" stroke="#4f6d7a" stroke-width="2"/>
    <text x="320" y="664" text-anchor="middle" font-size="28" font-weight="700" fill="#2f4858">iOS / Android</text>
    <text x="320" y="702" text-anchor="middle" font-size="22" fill="#5d6b75">simulator or emulator</text>

    <rect x="60" y="794" width="520" height="126" rx="18" fill="#2f4858"/>
    <text x="320" y="840" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">Test run</text>
    <text x="320" y="878" text-anchor="middle" font-size="22" fill="#d9e2e8">exploratory checks</text>
    <text x="320" y="906" text-anchor="middle" font-size="22" fill="#d9e2e8">verify reproducibility</text>

    <line x1="320" y1="216" x2="320" y2="256" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>
    <line x1="320" y1="392" x2="320" y2="432" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>
    <line x1="320" y1="568" x2="320" y2="608" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>
    <line x1="320" y1="744" x2="320" y2="784" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>
  </g>
</svg>
