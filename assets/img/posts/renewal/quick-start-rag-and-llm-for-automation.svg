<svg xmlns="http://www.w3.org/2000/svg" width="640" height="950" viewBox="0 0 640 950" role="img" aria-labelledby="title desc">
  <title id="title">RAG flow for automation scripts</title>
  <desc id="desc">Scripts become chunks and embeddings, are stored in a FAISS vector index, retrieved as context, and passed to an LLM with grounding instructions.</desc>
  <rect width="640" height="950" fill="#fbfaf7"/>
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4f6d7a"/></marker>
  </defs>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="320" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#2f4858">RAG flow for automation scripts</text>

    <rect x="60" y="90" width="520" height="126" rx="18" fill="#e6edf1" stroke="#4f6d7a" stroke-width="2"/>
    <text x="320" y="136" text-anchor="middle" font-size="28" font-weight="700" fill="#2f4858">Scripts</text>
    <text x="320" y="174" text-anchor="middle" font-size="22" fill="#5d6b75">repository examples</text>

    <rect x="60" y="266" width="520" height="126" rx="18" fill="#e6edf1" stroke="#4f6d7a" stroke-width="2"/>
    <text x="320" y="312" text-anchor="middle" font-size="28" font-weight="700" fill="#2f4858">Chunk + embed</text>
    <text x="320" y="350" text-anchor="middle" font-size="22" fill="#5d6b75">size 100, overlap 25</text>
    <text x="320" y="378" text-anchor="middle" font-size="22" fill="#5d6b75">mxbai-embed-large</text>

    <rect x="60" y="442" width="520" height="126" rx="18" fill="#f4ecd8" stroke="#c9a227" stroke-width="2"/>
    <text x="320" y="488" text-anchor="middle" font-size="28" font-weight="700" fill="#2f4858">FAISS index</text>
    <text x="320" y="526" text-anchor="middle" font-size="22" fill="#5d6b75">vector search</text>

    <rect x="60" y="618" width="520" height="126" rx="18" fill="#e6edf1" stroke="#4f6d7a" stroke-width="2"/>
    <text x="320" y="664" text-anchor="middle" font-size="28" font-weight="700" fill="#2f4858">Retrieve top-k</text>
    <text x="320" y="702" text-anchor="middle" font-size="22" fill="#5d6b75">nearest chunks</text>

    <rect x="60" y="794" width="520" height="126" rx="18" fill="#2f4858"/>
    <text x="320" y="840" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">Prompt + LLM</text>
    <text x="320" y="878" text-anchor="middle" font-size="22" fill="#d9e2e8">temperature 0</text>
    <text x="320" y="906" text-anchor="middle" font-size="22" fill="#d9e2e8">answer with sources</text>

    <line x1="320" y1="216" x2="320" y2="256" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>
    <line x1="320" y1="392" x2="320" y2="432" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>
    <line x1="320" y1="568" x2="320" y2="608" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>
    <line x1="320" y1="744" x2="320" y2="784" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>
  </g>
</svg>
