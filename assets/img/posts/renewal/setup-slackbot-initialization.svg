<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960" role="img" aria-labelledby="title desc">
  <title id="title">From a button click to a completed Slack job</title>
  <desc id="desc">Slack sends the action payload, the app acknowledges within about three seconds, checks the actor's permission for the target and action on the server, groups duplicate delivery of one operation, and updates the same message with the result. A visible button is not authorization, and a deduplication lock alone does not guarantee exactly-once execution.</desc>
  <rect width="640" height="960" fill="#fbfaf7"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4f6d7a"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="320" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#1f2d36">From click to completed job</text>
    <text x="320" y="80" text-anchor="middle" font-size="22" fill="#4a5a64">A visible button is not permission</text>

    <rect x="60" y="108" width="520" height="122" rx="16" fill="#e6edf1" stroke="#4f6d7a" stroke-width="2"/>
    <text x="320" y="150" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2d36">User clicks the button</text>
    <text x="320" y="186" text-anchor="middle" font-size="22" fill="#3f4f59">Slack sends an action payload</text>
    <text x="320" y="214" text-anchor="middle" font-size="22" fill="#3f4f59">anyone who sees it can press it</text>

    <line x1="320" y1="230" x2="320" y2="264" stroke="#4f6d7a" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="60" y="266" width="520" height="122" rx="16" fill="#f4ecd8" stroke="#c9a227" stroke-width="2"/>
    <text x="320" y="308" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2d36">Acknowledge within ~3 seconds</text>
    <text x="320" y="344" text-anchor="middle" font-size="22" fill="#3f4f59">accept now, run the work later</text>
    <text x="320" y="372" text-anchor="middle" font-size="22" fill="#3f4f59">late ack: error, then another click</text>

    <line x1="320" y1="388" x2="320" y2="422" stroke="#4f6d7a" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="60" y="424" width="520" height="122" rx="16" fill="#e6edf1" stroke="#4f6d7a" stroke-width="2"/>
    <text x="320" y="466" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2d36">Authorize on the server</text>
    <text x="320" y="502" text-anchor="middle" font-size="22" fill="#3f4f59">may this actor act on this target?</text>
    <text x="320" y="530" text-anchor="middle" font-size="22" fill="#3f4f59">rendering the button is not a check</text>

    <line x1="320" y1="546" x2="320" y2="580" stroke="#4f6d7a" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="60" y="582" width="520" height="122" rx="16" fill="#e6edf1" stroke="#4f6d7a" stroke-width="2"/>
    <text x="320" y="624" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2d36">Deduplicate, then run</text>
    <text x="320" y="660" text-anchor="middle" font-size="22" fill="#3f4f59">one operation, one job record</text>
    <text x="320" y="688" text-anchor="middle" font-size="22" fill="#3f4f59">retries and crashes need more</text>

    <line x1="320" y1="704" x2="320" y2="738" stroke="#4f6d7a" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="60" y="740" width="520" height="122" rx="16" fill="#2f4858"/>
    <text x="320" y="782" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Update the same message</text>
    <text x="320" y="818" text-anchor="middle" font-size="22" fill="#d9e2e8">accepted, running, done, failed</text>
    <text x="320" y="846" text-anchor="middle" font-size="22" fill="#d9e2e8">the job id links message and logs</text>

    <text x="320" y="912" text-anchor="middle" font-size="22" fill="#4a5a64">Socket Mode changes the transport, not the authorization.</text>
    <text x="320" y="942" text-anchor="middle" font-size="22" fill="#4a5a64">Events are acked by the SDK; interactive handlers ack explicitly.</text>
  </g>
</svg>
