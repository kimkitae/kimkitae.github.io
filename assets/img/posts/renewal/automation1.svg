<svg xmlns="http://www.w3.org/2000/svg" width="640" height="820" viewBox="0 0 640 820" role="img" aria-labelledby="title desc">
  <title id="title">Appium Android practice flow</title>
  <desc id="desc">An Android app is launched, an element is located by id or accessibility, tapped, and asserted in a small Appium example.</desc>
  <rect width="640" height="820" fill="#fbfaf7"/>
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4f6d7a"/></marker>
  </defs>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="320" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#2f4858">Appium Android practice flow</text>

    <rect x="60" y="90" width="520" height="126" rx="18" fill="#e6edf1" stroke="#4f6d7a" stroke-width="2"/>
    <text x="320" y="136" text-anchor="middle" font-size="28" font-weight="700" fill="#2f4858">Launch app</text>
    <text x="320" y="174" text-anchor="middle" font-size="22" fill="#5d6b75">Appium session</text>

    <rect x="60" y="266" width="520" height="126" rx="18" fill="#e6edf1" stroke="#4f6d7a" stroke-width="2"/>
    <text x="320" y="312" text-anchor="middle" font-size="28" font-weight="700" fill="#2f4858">Find element</text>
    <text x="320" y="350" text-anchor="middle" font-size="22" fill="#5d6b75">id or accessibility</text>

    <rect x="60" y="442" width="520" height="126" rx="18" fill="#f4ecd8" stroke="#c9a227" stroke-width="2"/>
    <text x="320" y="488" text-anchor="middle" font-size="28" font-weight="700" fill="#2f4858">Tap</text>
    <text x="320" y="526" text-anchor="middle" font-size="22" fill="#5d6b75">element.click()</text>

    <rect x="60" y="618" width="520" height="126" rx="18" fill="#2f4858"/>
    <text x="320" y="664" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">Assert</text>
    <text x="320" y="702" text-anchor="middle" font-size="22" fill="#d9e2e8">expected state</text>

    <line x1="320" y1="216" x2="320" y2="256" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>
    <line x1="320" y1="392" x2="320" y2="432" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>
    <line x1="320" y1="568" x2="320" y2="608" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>

    <text x="320" y="786" text-anchor="middle" font-size="22" fill="#5d6b75">A minimal example for element and assertion practice.</text>
  </g>
</svg>
