<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1000" viewBox="0 0 640 1000" role="img" aria-labelledby="title desc">
  <title id="title">Log viewer architecture</title>
  <desc id="desc">Automation clients send logs to FastAPI, which publishes to Kafka; a consumer stores logs in MariaDB and publishes to Redis pub/sub, and the web UI reads history and receives the live WebSocket stream.</desc>
  <rect width="640" height="1000" fill="#fbfaf7"/>
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4f6d7a"/></marker>
  </defs>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="320" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#2f4858">Log viewer architecture</text>

    <rect x="60" y="82" width="520" height="108" rx="16" fill="#e6edf1" stroke="#4f6d7a" stroke-width="2"/>
    <text x="320" y="124" text-anchor="middle" font-size="28" font-weight="700" fill="#2f4858">Clients</text>
    <text x="320" y="158" text-anchor="middle" font-size="22" fill="#5d6b75">automation tools</text>

    <rect x="60" y="226" width="520" height="108" rx="16" fill="#e6edf1" stroke="#4f6d7a" stroke-width="2"/>
    <text x="320" y="268" text-anchor="middle" font-size="28" font-weight="700" fill="#2f4858">FastAPI</text>
    <text x="320" y="302" text-anchor="middle" font-size="22" fill="#5d6b75">validate + enqueue</text>

    <rect x="60" y="370" width="520" height="108" rx="16" fill="#f4ecd8" stroke="#c9a227" stroke-width="2"/>
    <text x="320" y="412" text-anchor="middle" font-size="28" font-weight="700" fill="#2f4858">Kafka</text>
    <text x="320" y="446" text-anchor="middle" font-size="22" fill="#5d6b75">log topic</text>

    <rect x="60" y="514" width="520" height="108" rx="16" fill="#e6edf1" stroke="#4f6d7a" stroke-width="2"/>
    <text x="320" y="556" text-anchor="middle" font-size="28" font-weight="700" fill="#2f4858">Consumer</text>
    <text x="320" y="590" text-anchor="middle" font-size="22" fill="#5d6b75">store + publish</text>

    <rect x="40" y="658" width="260" height="108" rx="16" fill="#e6edf1" stroke="#4f6d7a" stroke-width="2"/>
    <text x="170" y="700" text-anchor="middle" font-size="28" font-weight="700" fill="#2f4858">MariaDB</text>
    <text x="170" y="734" text-anchor="middle" font-size="22" fill="#5d6b75">history</text>

    <rect x="340" y="658" width="260" height="108" rx="16" fill="#e6edf1" stroke="#4f6d7a" stroke-width="2"/>
    <text x="470" y="700" text-anchor="middle" font-size="28" font-weight="700" fill="#2f4858">Redis pub/sub</text>
    <text x="470" y="734" text-anchor="middle" font-size="22" fill="#5d6b75">live channel</text>

    <rect x="60" y="802" width="520" height="108" rx="16" fill="#2f4858"/>
    <text x="320" y="844" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">Web UI</text>
    <text x="320" y="878" text-anchor="middle" font-size="22" fill="#d9e2e8">filters + live stream</text>

    <line x1="320" y1="190" x2="320" y2="216" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>
    <line x1="320" y1="334" x2="320" y2="360" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>
    <line x1="320" y1="478" x2="320" y2="504" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>

    <path d="M320 622 L320 640 L170 640 L170 650" fill="none" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>
    <path d="M320 640 L470 640 L470 650" fill="none" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>
    <path d="M170 766 L170 782 L250 782 L250 794" fill="none" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>
    <path d="M470 766 L470 782 L390 782 L390 794" fill="none" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>

    <text x="320" y="960" text-anchor="middle" font-size="22" fill="#5d6b75">Storage and live delivery are separate concerns.</text>
  </g>
</svg>
