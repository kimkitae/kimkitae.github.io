<svg xmlns="http://www.w3.org/2000/svg" width="640" height="680" viewBox="0 0 640 680" role="img" aria-labelledby="title desc">
  <title id="title">Coverage outline from product factors</title>
  <desc id="desc">The DevelopSense article on test cases and coverage leads to a coverage outline driven by product factors and risk, then a daily report.</desc>
  <rect width="640" height="680" fill="#fbfaf7"/>
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4f6d7a"/></marker>
  </defs>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="320" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#2f4858">Coverage outline from product factors</text>

    <rect x="60" y="90" width="520" height="126" rx="18" fill="#e6edf1" stroke="#4f6d7a" stroke-width="2"/>
    <text x="320" y="136" text-anchor="middle" font-size="28" font-weight="700" fill="#2f4858">DevelopSense article</text>
    <text x="320" y="174" text-anchor="middle" font-size="22" fill="#5d6b75">Test Cases and Coverage</text>
    <text x="320" y="202" text-anchor="middle" font-size="22" fill="#5d6b75">2018-06-28 · linked source</text>

    <rect x="60" y="266" width="520" height="126" rx="18" fill="#f4ecd8" stroke="#c9a227" stroke-width="2"/>
    <text x="320" y="312" text-anchor="middle" font-size="28" font-weight="700" fill="#2f4858">Coverage outline</text>
    <text x="320" y="350" text-anchor="middle" font-size="22" fill="#5d6b75">product factors + risk</text>
    <text x="320" y="378" text-anchor="middle" font-size="22" fill="#5d6b75">testability notes</text>

    <rect x="60" y="442" width="520" height="126" rx="18" fill="#2f4858"/>
    <text x="320" y="488" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">Daily report</text>
    <text x="320" y="526" text-anchor="middle" font-size="22" fill="#d9e2e8">known and unknown</text>
    <text x="320" y="554" text-anchor="middle" font-size="22" fill="#d9e2e8">blockers and risks</text>

    <line x1="320" y1="216" x2="320" y2="256" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>
    <line x1="320" y1="392" x2="320" y2="432" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>

    <text x="320" y="622" text-anchor="middle" font-size="22" fill="#5d6b75">A reading note, not a translation.</text>
    <text x="320" y="654" text-anchor="middle" font-size="22" fill="#5d6b75">The original link is included.</text>
  </g>
</svg>
