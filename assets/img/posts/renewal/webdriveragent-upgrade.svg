<svg xmlns="http://www.w3.org/2000/svg" width="640" height="840" viewBox="0 0 640 840" role="img" aria-labelledby="title desc">
  <title id="title">Historical WebDriverAgent rebuild</title>
  <desc id="desc">In 2021 an Appium install used a separately replaced WebDriverAgent with Carthage dependencies to drive an iOS device.</desc>
  <rect width="640" height="840" fill="#F7F9FB"/>
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#006779"/></marker>
  </defs>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="320" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#101416">Historical WebDriverAgent rebuild</text>

    <rect x="60" y="90" width="520" height="126" rx="4" fill="#F7F9FB" stroke="#006779" stroke-width="2"/>
    <text x="320" y="136" text-anchor="middle" font-size="28" font-weight="700" fill="#101416">Appium</text>
    <text x="320" y="174" text-anchor="middle" font-size="22" fill="#526573">existing version kept</text>

    <rect x="60" y="266" width="520" height="126" rx="4" fill="#f4ecd8" stroke="#c9a227" stroke-width="2"/>
    <text x="320" y="312" text-anchor="middle" font-size="28" font-weight="700" fill="#101416">WebDriverAgent</text>
    <text x="320" y="350" text-anchor="middle" font-size="22" fill="#526573">folder replaced</text>
    <text x="320" y="378" text-anchor="middle" font-size="22" fill="#526573">Carthage files copied</text>

    <rect x="60" y="442" width="520" height="126" rx="4" fill="#F7F9FB" stroke="#006779" stroke-width="2"/>
    <text x="320" y="488" text-anchor="middle" font-size="28" font-weight="700" fill="#101416">Dependencies</text>
    <text x="320" y="526" text-anchor="middle" font-size="22" fill="#526573">bootstrap build</text>

    <rect x="60" y="618" width="520" height="126" rx="4" fill="#101416"/>
    <text x="320" y="664" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">iOS device</text>
    <text x="320" y="702" text-anchor="middle" font-size="22" fill="#F4F6F5">iOS 14.4</text>

    <line x1="320" y1="216" x2="320" y2="256" stroke="#006779" stroke-width="3" marker-end="url(#a)"/>
    <line x1="320" y1="392" x2="320" y2="432" stroke="#006779" stroke-width="3" marker-end="url(#a)"/>
    <line x1="320" y1="568" x2="320" y2="608" stroke="#006779" stroke-width="3" marker-end="url(#a)"/>

    <text x="320" y="790" text-anchor="middle" font-size="22" fill="#526573">Historical setup, 2021.</text>
    <text x="320" y="820" text-anchor="middle" font-size="22" fill="#526573">Use current xcuitest driver docs today.</text>
  </g>
</svg>
