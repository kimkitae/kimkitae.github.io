<svg xmlns="http://www.w3.org/2000/svg" width="640" height="940" viewBox="0 0 640 940" role="img" aria-labelledby="title desc">
  <title id="title">Four questions before an audio match counts</title>
  <desc id="desc">Check whether the recording has an audio stream, whether sound occurred, whether it is the expected sound using positive and negative controls, and whether the user received the notification. Each failing branch is a different problem, and a match answers only the third question.</desc>
  <rect width="640" height="940" fill="#F7F9FB"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#006779"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="320" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#172B3A">Four questions before a match</text>
    <text x="320" y="80" text-anchor="middle" font-size="22" fill="#526573">One score answers only the third</text>

    <rect x="30" y="112" width="370" height="150" rx="4" fill="#F7F9FB" stroke="#006779" stroke-width="2"/>
    <text x="215" y="154" text-anchor="middle" font-size="24" font-weight="700" fill="#172B3A">1. Audio stream present?</text>
    <text x="215" y="192" text-anchor="middle" font-size="22" fill="#526573">ffprobe -select_streams a:0</text>
    <text x="215" y="224" text-anchor="middle" font-size="22" fill="#526573">empty output means no audio</text>

    <rect x="430" y="112" width="190" height="150" rx="4" fill="#fdecea" stroke="#b3261e" stroke-width="2"/>
    <text x="525" y="154" text-anchor="middle" font-size="22" font-weight="700" fill="#7a1f1a">No stream</text>
    <text x="525" y="186" text-anchor="middle" font-size="22" fill="#7a1f1a">capture failure</text>
    <text x="525" y="218" text-anchor="middle" font-size="22" fill="#7a1f1a">not silence</text>

    <line x1="400" y1="187" x2="424" y2="187" stroke="#b3261e" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="215" y1="262" x2="215" y2="296" stroke="#006779" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="30" y="300" width="370" height="150" rx="4" fill="#F7F9FB" stroke="#006779" stroke-width="2"/>
    <text x="215" y="342" text-anchor="middle" font-size="24" font-weight="700" fill="#172B3A">2. Did sound occur?</text>
    <text x="215" y="380" text-anchor="middle" font-size="22" fill="#526573">volumedetect + a positive control</text>
    <text x="215" y="412" text-anchor="middle" font-size="22" fill="#526573">very low volume = capture first</text>

    <rect x="430" y="300" width="190" height="150" rx="4" fill="#f4ecd8" stroke="#c9a227" stroke-width="2"/>
    <text x="525" y="342" text-anchor="middle" font-size="22" font-weight="700" fill="#5d5323">Silent file</text>
    <text x="525" y="374" text-anchor="middle" font-size="22" fill="#5d5323">cannot judge</text>
    <text x="525" y="406" text-anchor="middle" font-size="22" fill="#5d5323">occurrence</text>

    <line x1="400" y1="375" x2="424" y2="375" stroke="#006779" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="215" y1="450" x2="215" y2="484" stroke="#006779" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="30" y="488" width="370" height="150" rx="4" fill="#F7F9FB" stroke="#006779" stroke-width="2"/>
    <text x="215" y="530" text-anchor="middle" font-size="24" font-weight="700" fill="#172B3A">3. Is it the expected sound?</text>
    <text x="215" y="568" text-anchor="middle" font-size="22" fill="#526573">positive vs negative scores</text>
    <text x="215" y="600" text-anchor="middle" font-size="22" fill="#526573">threshold between distributions</text>

    <rect x="430" y="488" width="190" height="150" rx="4" fill="#f4ecd8" stroke="#c9a227" stroke-width="2"/>
    <text x="525" y="530" text-anchor="middle" font-size="22" font-weight="700" fill="#5d5323">Overlap</text>
    <text x="525" y="562" text-anchor="middle" font-size="22" fill="#5d5323">no error-free</text>
    <text x="525" y="594" text-anchor="middle" font-size="22" fill="#5d5323">threshold here</text>

    <line x1="400" y1="563" x2="424" y2="563" stroke="#006779" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="215" y1="638" x2="215" y2="672" stroke="#006779" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="30" y="676" width="370" height="150" rx="4" fill="#e7f4ec" stroke="#1e6b3a" stroke-width="2"/>
    <text x="215" y="718" text-anchor="middle" font-size="24" font-weight="700" fill="#172B3A">4. Did the user get it?</text>
    <text x="215" y="756" text-anchor="middle" font-size="22" fill="#526573">UI screenshot or API state</text>
    <text x="215" y="788" text-anchor="middle" font-size="22" fill="#526573">sound is not delivery</text>

    <rect x="430" y="676" width="190" height="150" rx="4" fill="#fdecea" stroke="#b3261e" stroke-width="2"/>
    <text x="525" y="718" text-anchor="middle" font-size="22" font-weight="700" fill="#7a1f1a">Match passes</text>
    <text x="525" y="750" text-anchor="middle" font-size="22" fill="#7a1f1a">user sees</text>
    <text x="525" y="782" text-anchor="middle" font-size="22" fill="#7a1f1a">nothing</text>

    <line x1="400" y1="751" x2="424" y2="751" stroke="#b3261e" stroke-width="3" marker-end="url(#arrow)"/>

    <text x="320" y="886" text-anchor="middle" font-size="22" fill="#526573">Each failing branch is a different problem.</text>
    <text x="320" y="916" text-anchor="middle" font-size="22" fill="#526573">Keep the recording and the reference on failure.</text>
  </g>
</svg>
