<svg xmlns="http://www.w3.org/2000/svg" width="640" height="950" viewBox="0 0 640 950" role="img" aria-labelledby="title desc">
  <title id="title">Reading note to practical questions</title>
  <desc id="desc">A community article is turned into questions about team, product, technology, and collaboration instead of being republished.</desc>
  <rect width="640" height="950" fill="#fbfaf7"/>
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4f6d7a"/></marker>
  </defs>
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="320" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#2f4858">Reading note to practical questions</text>

    <rect x="60" y="90" width="520" height="126" rx="18" fill="#e6edf1" stroke="#4f6d7a" stroke-width="2"/>
    <text x="320" y="136" text-anchor="middle" font-size="28" font-weight="700" fill="#2f4858">Community article</text>
    <text x="320" y="174" text-anchor="middle" font-size="22" fill="#5d6b75">99 ideas from testers</text>
    <text x="320" y="202" text-anchor="middle" font-size="22" fill="#5d6b75">link and attribution</text>

    <rect x="60" y="266" width="520" height="126" rx="18" fill="#f4ecd8" stroke="#c9a227" stroke-width="2"/>
    <text x="320" y="312" text-anchor="middle" font-size="28" font-weight="700" fill="#2f4858">Team</text>
    <text x="320" y="350" text-anchor="middle" font-size="22" fill="#5d6b75">same language for quality?</text>
    <text x="320" y="378" text-anchor="middle" font-size="22" fill="#5d6b75">problem in the system?</text>

    <rect x="60" y="442" width="520" height="126" rx="18" fill="#f4ecd8" stroke="#c9a227" stroke-width="2"/>
    <text x="320" y="488" text-anchor="middle" font-size="28" font-weight="700" fill="#2f4858">Product</text>
    <text x="320" y="526" text-anchor="middle" font-size="22" fill="#5d6b75">business value?</text>
    <text x="320" y="554" text-anchor="middle" font-size="22" fill="#5d6b75">risk and user journeys?</text>

    <rect x="60" y="618" width="520" height="126" rx="18" fill="#f4ecd8" stroke="#c9a227" stroke-width="2"/>
    <text x="320" y="664" text-anchor="middle" font-size="28" font-weight="700" fill="#2f4858">Technology</text>
    <text x="320" y="702" text-anchor="middle" font-size="22" fill="#5d6b75">logs and APIs?</text>
    <text x="320" y="730" text-anchor="middle" font-size="22" fill="#5d6b75">explain the failure?</text>

    <rect x="60" y="794" width="520" height="126" rx="18" fill="#2f4858"/>
    <text x="320" y="840" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">Collaboration</text>
    <text x="320" y="878" text-anchor="middle" font-size="22" fill="#d9e2e8">shared learning?</text>
    <text x="320" y="906" text-anchor="middle" font-size="22" fill="#d9e2e8">not only pass or fail</text>

    <line x1="320" y1="216" x2="320" y2="256" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>
    <line x1="320" y1="392" x2="320" y2="432" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>
    <line x1="320" y1="568" x2="320" y2="608" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>
    <line x1="320" y1="744" x2="320" y2="784" stroke="#4f6d7a" stroke-width="3" marker-end="url(#a)"/>
  </g>
</svg>
